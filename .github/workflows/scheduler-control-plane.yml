name: Scheduler Control Plane

on:
  pull_request:
    branches:
      - develop
    paths:
      - ".github/workflows/scheduler-control-plane.yml"
      - "mint_server/backend/contracts/control_plane_contracts.py"
      - "mint_server/backend/scheduling/model_work_scheduler.py"
      - "mint_server/backend/actors/model_engine_host.py"
      - "mint_server/backend/scheduling/model_work_task_gateway.py"
      - "mint_server/backend/actors/model_actor_supervisor.py"
      - "mint_server/backend/contracts/engine_liveness.py"
      - "mint_server/backend/scheduling/cluster_placement_controller.py"
      - "mint_server/backend/contracts/model_placement_topology.py"
      - "scripts/tools/ci_scheduler_control_plane.sh"
      - "scripts/tools/verify_scheduler_control_plane.py"
      - "tests/component/control_plane/**"
      - "tests/conftest.py"
      - "tests/test_cluster_placement_controller.py"
      - "tests/test_stateless_control_plane_guardrails.py"
      - "tests/test_issue_593_model_work_scheduler.py"
      - "tests/test_issue_593_model_engine_host.py"
      - "tests/test_issue_593_model_actor_supervisor.py"
      - "tests/test_model_work_task_gateway.py"
      - "pyproject.toml"
      - "pyrightconfig.scheduler-ci.json"
      - "tests/typing_stubs/**"
      - "uv.lock"
  push:
    branches:
      - develop
      - nolan/scheduler-contract
    paths:
      - ".github/workflows/scheduler-control-plane.yml"
      - "mint_server/backend/contracts/control_plane_contracts.py"
      - "mint_server/backend/scheduling/model_work_scheduler.py"
      - "mint_server/backend/actors/model_engine_host.py"
      - "mint_server/backend/scheduling/model_work_task_gateway.py"
      - "mint_server/backend/actors/model_actor_supervisor.py"
      - "mint_server/backend/contracts/engine_liveness.py"
      - "mint_server/backend/scheduling/cluster_placement_controller.py"
      - "mint_server/backend/contracts/model_placement_topology.py"
      - "scripts/tools/ci_scheduler_control_plane.sh"
      - "scripts/tools/verify_scheduler_control_plane.py"
      - "tests/component/control_plane/**"
      - "tests/conftest.py"
      - "tests/test_cluster_placement_controller.py"
      - "tests/test_stateless_control_plane_guardrails.py"
      - "tests/test_issue_593_model_work_scheduler.py"
      - "tests/test_issue_593_model_engine_host.py"
      - "tests/test_issue_593_model_actor_supervisor.py"
      - "tests/test_model_work_task_gateway.py"
      - "pyproject.toml"
      - "pyrightconfig.scheduler-ci.json"
      - "tests/typing_stubs/**"
      - "uv.lock"
  workflow_dispatch:

jobs:
  scheduler-control-plane:
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    env:
      UV_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
      PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install scheduler CI dependencies
        run: |
          uv venv --python 3.12
          uv pip install --python .venv/bin/python --index-url "$UV_INDEX_URL" \
            coverage==7.14.1 \
            fastapi==0.121.2 \
            httpx==0.27.2 \
            opentelemetry-api==1.38.0 \
            pydantic==2.12.4 \
            pyright==1.1.409 \
            "pytest>=7.0.0" \
            "pyyaml>=6.0.0" \
            "requests>=2.32.0" \
            ruff==0.15.5 \
            "trio>=0.33.0"

      - name: Run scheduler control-plane CI gate
        env:
          MINT_CI_UV_NO_SYNC: "1"
        run: scripts/tools/ci_scheduler_control_plane.sh
