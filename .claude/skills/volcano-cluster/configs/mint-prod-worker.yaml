# MINT Production Ray GPU Worker - DO NOT MODIFY FOR DEV
# This cluster is for production deployment only.
#
# Before submitting:
#   - Ensure mint-prod-head is running and has written ray_head_ip.txt
#   - (Optional) Verify head IP: volc ml_task logs -t <head_task_id> -i worker_0 | grep "MINT Production Ray head IP"
#   - Replace <GPU_QUEUE_ID> below with the desired GPU queue id (prod prefers C1 or C2)
#
# Submit with: volc ml_task submit -c mint-prod-worker.yaml --output json

TaskName: "mint-prod-worker"
Description: "MINT PRODUCTION - Ray GPU worker - DO NOT USE FOR DEV"

Entrypoint: |
  export HF_HUB_OFFLINE=1
  export HF_HOME=/vePFS-Mindverse/share/huggingface
  export PYTHONDONTWRITEBYTECODE=1  # Disable .pyc cache

  # Symlink to the production server checkout for debugging and explicit local probes.
  rm -rf /root/tinker_project/mint-server
  mkdir -p /root/tinker_project
  ln -s /vePFS-Mindverse/share/mint/prod/mint-server /root/tinker_project/mint-server

  echo "=== MINT PRODUCTION WORKER ==="
  echo "Started at $(date)"
  echo "Using PFS code via symlink:"
  ls -la /root/tinker_project/mint-server/

  # Note: Ray CLI crashes on startup; start Ray via Python internals.
  set -euo pipefail
  python3 - <<'PY'
  import os
  import shutil
  import socket
  import time
  from pathlib import Path

  import ray
  from ray._private.node import Node
  from ray._private.parameter import RayParams

  HEAD_IP_PATH = Path("/vePFS-Mindverse/share/mint/prod/ray/head-address/ray_head_ip.txt")
  TMP_ROOT = os.environ.get("MINT_TMP_ROOT", "/vePFS-Mindverse/share/mint-data/prod")
  RAY_TMP_ROOT_BASE = f"{TMP_ROOT}/worker"
  RAY_TMP_LINK = "/tmp/mpw"
  RAY_RUNTIME_ENV_WORKING_DIR_CACHE_SIZE_GB = "2"
  RAY_RUNTIME_ENV_PIP_CACHE_SIZE_GB = "2"
  CHECK_INTERVAL_S = 10
  BACKOFF_INITIAL_S = 5
  BACKOFF_MAX_S = 60
  BACKOFF_RESET_AFTER_HEALTHY_CHECKS = 6


  def _read_head_ip() -> str:
      try:
          return HEAD_IP_PATH.read_text(encoding="utf-8").strip()
      except FileNotFoundError:
          return ""


  def _port_open(host: str, port: int) -> bool:
      sock = socket.socket()
      sock.settimeout(2)
      try:
          sock.connect((host, port))
          return True
      except OSError:
          return False
      finally:
          sock.close()


  restart_delay_s = BACKOFF_INITIAL_S
  while True:
      head_ip = _read_head_ip()
      if not head_ip:
          print(f"mint-prod worker missing Ray head IP file: {HEAD_IP_PATH}", flush=True)
          print(f"mint-prod worker sleeping {restart_delay_s}s before retry", flush=True)
          time.sleep(restart_delay_s)
          restart_delay_s = min(BACKOFF_MAX_S, restart_delay_s * 2)
          continue

      head = f"{head_ip}:6379"
      ip = ray.util.get_node_ip_address()
      print(f"Local node IP: {ip}", flush=True)
      ray_tmp_root_real = f"{RAY_TMP_ROOT_BASE}/{ip.replace('.', '-')}"
      ray_temp_dir = f"{RAY_TMP_LINK}/t"
      ray_object_spilling_dir = f"{RAY_TMP_LINK}/s"
      ray_os_tmpdir = f"{RAY_TMP_LINK}/tmp"
      ray_xdg_cache_home = f"{RAY_TMP_LINK}/cache"
      os.makedirs(ray_tmp_root_real, exist_ok=True)
      if os.path.lexists(RAY_TMP_LINK):
          if os.path.islink(RAY_TMP_LINK) or os.path.isfile(RAY_TMP_LINK):
              os.unlink(RAY_TMP_LINK)
          elif os.path.isdir(RAY_TMP_LINK):
              shutil.rmtree(RAY_TMP_LINK)
          else:
              raise RuntimeError(f"refusing to replace temp path: {RAY_TMP_LINK}")
      os.symlink(ray_tmp_root_real, RAY_TMP_LINK)
      if not os.path.islink(RAY_TMP_LINK) or os.path.realpath(RAY_TMP_LINK) != os.path.realpath(ray_tmp_root_real):
          raise RuntimeError(f"ray temp symlink mismatch: {RAY_TMP_LINK} -> {os.path.realpath(RAY_TMP_LINK)} expected {os.path.realpath(ray_tmp_root_real)}")
      os.makedirs(ray_temp_dir, exist_ok=True)
      os.makedirs(ray_object_spilling_dir, exist_ok=True)
      os.makedirs(ray_os_tmpdir, exist_ok=True)
      os.makedirs(ray_xdg_cache_home, exist_ok=True)
      os.environ["TMPDIR"] = ray_os_tmpdir
      os.environ["XDG_CACHE_HOME"] = ray_xdg_cache_home
      os.environ.setdefault("RAY_RUNTIME_ENV_WORKING_DIR_CACHE_SIZE_GB", RAY_RUNTIME_ENV_WORKING_DIR_CACHE_SIZE_GB)
      os.environ.setdefault("RAY_RUNTIME_ENV_PIP_CACHE_SIZE_GB", RAY_RUNTIME_ENV_PIP_CACHE_SIZE_GB)
      print(f"Connecting to Ray head at {head}", flush=True)
      print(
          "mint-prod worker using "
          f"temp_dir={ray_temp_dir} object_spilling_directory={ray_object_spilling_dir} "
          f"tmpdir={ray_os_tmpdir} xdg_cache_home={ray_xdg_cache_home} tmp_root={TMP_ROOT} real_root={ray_tmp_root_real}",
          flush=True,
      )

      ray_params = RayParams(
          gcs_address=head,
          num_gpus=8,
          temp_dir=ray_temp_dir,
          object_spilling_directory=ray_object_spilling_dir,
      )
      node = None
      healthy_checks = 0
      try:
          node = Node(ray_params, head=False, shutdown_at_exit=False, spawn_reaper=False)
          print(f"mint-prod worker joined Ray head at {head}", flush=True)
          while True:
              if not _port_open(head_ip, 6379):
                  print(f"mint-prod worker lost connectivity to Ray head {head}", flush=True)
                  break
              dead = node.dead_processes()
              if dead:
                  print(f"mint-prod worker detected dead ray processes: {dead!r}; restarting worker node", flush=True)
                  break
              healthy_checks += 1
              if healthy_checks >= BACKOFF_RESET_AFTER_HEALTHY_CHECKS and restart_delay_s != BACKOFF_INITIAL_S:
                  print("mint-prod worker reset restart backoff to 5s after stable run", flush=True)
                  restart_delay_s = BACKOFF_INITIAL_S
              time.sleep(CHECK_INTERVAL_S)
      except Exception as e:
          print(f"mint-prod worker wrapper caught exception: {type(e).__name__}: {e}", flush=True)
      finally:
          if node is not None:
              try:
                  node.kill_all_processes(check_alive=False, allow_graceful=False, wait=True)
              except Exception as e:
                  print(f"mint-prod worker cleanup failed: {type(e).__name__}: {e}", flush=True)
          print(f"mint-prod worker sleeping {restart_delay_s}s before retry", flush=True)
          time.sleep(restart_delay_s)
          restart_delay_s = min(BACKOFF_MAX_S, restart_delay_s * 2)
  PY

ImageUrl: "image-mindverse-cn-beijing.cr.volces.com/namespace-mindverse/mint:16-sm80"
ResourceQueueID: "<GPU_QUEUE_ID>"  # Prod prefers a800-mindverse-C1 (q-20251126180002-26lwz) or C2 (q-20260203101340-www2h). Set explicitly before submit.
Framework: "Custom"

TaskRoleSpecs:
    - RoleName: "worker"
      RoleReplicas: 1
      Flavor: "ml.hpcpni2l.28xlarge"  # 8x A800 80GB (RDMA)

# No time limit - runs indefinitely
ActiveDeadlineSeconds: 0
DelayExitTimeSeconds: 0
AccessType: "Private"

Storages:
    - Type: "Vepfs"
      MountPath: "/vePFS-Mindverse"
      SubPath: ""
      ReadOnly: true
    - Type: "Vepfs"
      MountPath: "/vePFS-Mindverse/share"
      SubPath: "share"
      ReadOnly: false
    - Type: "TosFuse"
      MountPath: "/tos-mindverse"
      Bucket: "tos-mindverse"
      Prefix: "/"
