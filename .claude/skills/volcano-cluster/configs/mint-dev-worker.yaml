# Ray GPU Worker - Template
#
# WARNING: This YAML is NOT directly usable.
# Before submitting, the agent must:
#   1. Look up the Ray head IP from task logs: volc ml_task logs -t <head_task_id> -i worker_0 | grep "Local node IP"
#   2. Replace <RAY_HEAD_IP> with the actual IP address
#   3. Adjust Flavor and --num-gpus as needed:
#      - ml.hpcpni2l.7xlarge  = 2 GPUs (RDMA)
#      - ml.hpcpni2l.14xlarge = 4 GPUs (RDMA)
#      - ml.hpcpni2l.28xlarge = 8 GPUs (RDMA)
#
# Submit with: volc ml_task submit -c ray_worker.yaml --output json

TaskName: "ray-worker-2d"
Description: "Ray GPU worker - A800, joins head cluster"

Entrypoint: |
  export HF_HUB_OFFLINE=1
  export HF_HOME=/vePFS-Mindverse/share/huggingface
  export PYTHONDONTWRITEBYTECODE=1  # Disable .pyc cache to avoid bytecode/source mismatch

  # Symlink to PFS code
  rm -rf /root/tinker_project/tinker-server
  mkdir -p /root/tinker_project
  ln -s /vePFS-Mindverse/share/code/tinker-server /root/tinker_project/tinker-server

  # Connect to Ray head
  ray start --address='192.168.32.208:6379' --num-gpus=8 && sleep infinity

ImageUrl: "image-mindverse-cn-beijing.cr.volces.com/namespace-mindverse/mint:4"
ResourceQueueID: "q-20251126180002-26lwz"
Framework: "Custom"

TaskRoleSpecs:
    - RoleName: "worker"
      RoleReplicas: 2  # 2 × 8 GPUs = 16 GPUs
      Flavor: "ml.hpcpni2l.28xlarge"  # 8x A800 80GB (RDMA)

# No timeout (0 = unlimited)
ActiveDeadlineSeconds: 0
DelayExitTimeSeconds: 0
AccessType: "Private"

Storages:
    - Type: "Vepfs"
      MountPath: "/vePFS-Mindverse"
      SubPath: ""
      ReadOnly: true
    - Type: "Vepfs"
      MountPath: "/vePFS-Mindverse/share"
      SubPath: "share"
      ReadOnly: false
