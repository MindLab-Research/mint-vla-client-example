# Ray GPU Worker - Development
#
# Before submitting:
#   1. Get Ray head IP: volc ml_task logs -t <head_task_id> -i worker_0 | grep "Local node IP"
#   2. Replace <RAY_HEAD_IP> below with the actual IP address
#   3. Adjust RoleReplicas as needed: N replicas = 8*N GPUs
#
# Submit with: volc ml_task submit -c mint-dev-worker.yaml --output json

TaskName: "ray-worker"
Description: "Ray GPU worker - A800, joins dev cluster"

Entrypoint: |
  export HF_HUB_OFFLINE=1
  export HF_HOME=/vePFS-Mindverse/share/huggingface
  export PYTHONDONTWRITEBYTECODE=1

  # Symlink to PFS code (tinker-server for development)
  rm -rf /root/tinker_project/tinker-server
  mkdir -p /root/tinker_project
  ln -s /vePFS-Mindverse/share/code/tinker-server /root/tinker_project/tinker-server

  # Connect to Ray head - REPLACE <RAY_HEAD_IP> before submitting
  ray start --address='<RAY_HEAD_IP>:6379' --num-gpus=8 && sleep infinity

ImageUrl: "image-mindverse-cn-beijing.cr.volces.com/namespace-mindverse/mint:4"
ResourceQueueID: "q-20260124095758-ngkg7"  # GPU queue for dev workers
Framework: "Custom"

TaskRoleSpecs:
    - RoleName: "worker"
      RoleReplicas: 3  # 3 replicas = 24 GPUs (fills dev GPU queue). Adjust as needed.
      Flavor: "ml.hpcpni2l.28xlarge"  # 8x A800 80GB (RDMA)

# No timeout (0 = unlimited)
ActiveDeadlineSeconds: 0
DelayExitTimeSeconds: 0
AccessType: "Private"

Storages:
    - Type: "Vepfs"
      MountPath: "/vePFS-Mindverse"
      SubPath: ""
      ReadOnly: true
    - Type: "Vepfs"
      MountPath: "/vePFS-Mindverse/share"
      SubPath: "share"
      ReadOnly: false
