# Ray GPU Worker - 8 replicas for 64 GPUs (trainer)
# Head IP: 192.168.32.139

TaskName: "ray-worker-8x"
Description: "Ray GPU workers - 8x 8-GPU A800 nodes (64 GPUs for trainer)"

Entrypoint: |
  export HF_HUB_OFFLINE=1
  export HF_HOME=/vePFS-Mindverse/share/huggingface
  export PYTHONDONTWRITEBYTECODE=1

  # Symlink to PFS code
  rm -rf /root/tinker_project/tinker-server
  mkdir -p /root/tinker_project
  ln -s /vePFS-Mindverse/share/code/tinker-server /root/tinker_project/tinker-server

  # Connect to Ray head
  ray start --address='192.168.32.139:6379' --num-gpus=8 && sleep infinity

ImageUrl: "image-mindverse-cn-beijing.cr.volces.com/namespace-mindverse/mint:4"
ResourceQueueID: "q-20251126180002-26lwz"
Framework: "Custom"

TaskRoleSpecs:
    - RoleName: "worker"
      RoleReplicas: 8
      Flavor: "ml.hpcpni2l.28xlarge"  # 8x A800 80GB (RDMA)

ActiveDeadlineSeconds: 0
DelayExitTimeSeconds: 0
AccessType: "Private"

Storages:
    - Type: "Vepfs"
      MountPath: "/vePFS-Mindverse"
      SubPath: ""
      ReadOnly: true
    - Type: "Vepfs"
      MountPath: "/vePFS-Mindverse/share"
      SubPath: "share"
      ReadOnly: false
