# MINT Production Ray Head Node - DO NOT MODIFY FOR DEV
# This cluster is for production deployment only.
# Submit with: volc ml_task submit -c mint-prod-head.yaml --output json

TaskName: "mint-prod-head"
Description: "MINT PRODUCTION - Ray head node - DO NOT USE FOR DEV"

Entrypoint: |
  set -euo pipefail

  # Note: Ray CLI crashes on startup; start Ray via Python internals.
  # Note: dashboard is disabled (image missing dashboard deps like aiohttp_cors).
  python3 - <<'PY'
  import time

  import ray
  from ray._private.node import Node
  from ray._private.parameter import RayParams

  ip = ray.util.get_node_ip_address()
  print(f"Local node IP: {ip}", flush=True)

  ray_params = RayParams(
      num_cpus=4,
      num_gpus=0,
      include_dashboard=False,
      gcs_server_port=6379,
  )
  node = Node(ray_params, head=True, shutdown_at_exit=False, spawn_reaper=False)

  with open("/vePFS-Mindverse/share/code/tinker-server-auth/ray_head_ip.txt", "w") as f:
      f.write(ip)

  print(f"MINT Production Ray head IP: {ip}", flush=True)
  while True:
      time.sleep(3600)
  PY

ImageUrl: "image-mindverse-cn-beijing.cr.volces.com/namespace-mindverse/mint:14"
ResourceQueueID: "q-20251225183621-m2297"  # CPU queue for head node
Framework: "Custom"

TaskRoleSpecs:
    - RoleName: "worker"
      RoleReplicas: 1
      Flavor: "ml.g2a.xlarge"

# No time limit - runs indefinitely
ActiveDeadlineSeconds: 0
DelayExitTimeSeconds: 0
AccessType: "Private"

Storages:
    - Type: "Vepfs"
      MountPath: "/vePFS-Mindverse"
      SubPath: ""
      ReadOnly: true
    - Type: "Vepfs"
      MountPath: "/vePFS-Mindverse/share"
      SubPath: "share"
      ReadOnly: false
