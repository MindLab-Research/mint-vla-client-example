# MINT Production Ray Head Node - DO NOT MODIFY FOR DEV
# This cluster is for production deployment only.
# Submit with: volc ml_task submit -c mint-prod-head.yaml --output json

TaskName: "mint-prod-head"
Description: "MINT PRODUCTION - Ray head node - DO NOT USE FOR DEV"

Entrypoint: |
  # Start Ray head first to get the internal cluster IP
  ray start --head --port=6379 --dashboard-host=0.0.0.0 --dashboard-port=8265 --num-cpus=4 --num-gpus=0

  # Get the internal IP that Ray is using (from Ray's output)
  INTERNAL_IP=$(ray status 2>/dev/null | grep -oP 'node:\K[0-9.]+' | head -1 || hostname -i)
  echo "${INTERNAL_IP}" > /vePFS-Mindverse/share/code/tinker-server-auth/ray_head_ip.txt
  echo "MINT Production Ray head IP: ${INTERNAL_IP}"

  sleep infinity

ImageUrl: "image-mindverse-cn-beijing.cr.volces.com/namespace-mindverse/verl-vllm-megatron-lora:v0.1"
ResourceQueueID: "q-20251126180002-26lwz"
Framework: "Custom"

TaskRoleSpecs:
    - RoleName: "worker"
      RoleReplicas: 1
      Flavor: "ml.g2a.xlarge"

# No time limit - runs indefinitely
ActiveDeadlineSeconds: 0
DelayExitTimeSeconds: 0
AccessType: "Private"

Storages:
    - Type: "Vepfs"
      MountPath: "/vePFS-Mindverse"
      SubPath: ""
      ReadOnly: true
    - Type: "Vepfs"
      MountPath: "/vePFS-Mindverse/share"
      SubPath: "share"
      ReadOnly: false
