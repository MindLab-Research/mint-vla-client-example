[program:tinker-server-auth]
command=/bin/sh /root/tinker_project/tinker-server-auth/scripts/start_prod_server.sh
directory=/root/tinker_project/tinker-server-auth
autostart=true
autorestart=true
priority=10
startsecs=10
startretries=3
stopasgroup=true
killasgroup=true
user=root
stdout_logfile=/tmp/tinker_server_auth_supervisor.log
stderr_logfile=/tmp/tinker_server_auth_supervisor.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
redirect_stderr=true
environment=PYTHONUNBUFFERED="1"

[program:tinker-server-auth-watchdog]
command=/root/tinker_project/tinker-server-auth/.venv31213/bin/python scripts/prod_watchdog.py
directory=/root/tinker_project/tinker-server-auth
autostart=true
autorestart=true
priority=20
startsecs=1
startretries=3
stopasgroup=true
killasgroup=true
user=root
stdout_logfile=/tmp/tinker_server_auth_watchdog.log
stderr_logfile=/tmp/tinker_server_auth_watchdog.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
redirect_stderr=true
environment=PYTHONUNBUFFERED="1",TINKER_WATCHDOG_URL="http://localhost:18000/api/v1/healthz",TINKER_WATCHDOG_TIMEOUT_S="35",TINKER_WATCHDOG_INTERVAL_S="10",TINKER_WATCHDOG_FAILS_TO_RESTART="6",TINKER_WATCHDOG_RESTART_COOLDOWN_S="60",TINKER_WATCHDOG_BOOT_GRACE_S="60",TINKER_WATCHDOG_PROGRAM="tinker-server-auth"
