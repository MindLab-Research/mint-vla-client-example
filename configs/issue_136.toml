max_cpu_loras = 19
max_lora_rank = 23

[sampling]
max_inflight_sample_tasks = 7
max_concurrent_samples_per_request = 3
sample_coalesce = true
sample_coalesce_window_ms = 3.5
sample_coalesce_max_batch = 11
sample_coalesce_max_samples = 15
