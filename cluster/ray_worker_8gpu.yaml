# Ray GPU Worker - 8x GPU, ephemeral
# Joins existing Ray master cluster
# Submit with: volc ml_task submit -c ray_worker_8gpu.yaml

TaskName: "ray-worker-8gpu"
Description: "Ray GPU worker - 8x A100, joins master cluster"

# NOTE: Update HEAD_IP to match your Ray master's IP address
# Get it from: volc ml_task list -> select ray-master -> view instance IP
Entrypoint: |
  ray start --address='HEAD_IP:6379' --num-gpus=8 && sleep infinity

ImageUrl: "image-mindverse-cn-beijing.cr.volces.com/namespace-mindverse/verl-vllm-megatron-lora:v0.1"

ResourceQueueID: "q-20251126180002-26lwz"

Framework: "Custom"

TaskRoleSpecs:
    - RoleName: "worker"
      RoleReplicas: 1
      Flavor: "ml.pni2l.28xlarge"  # 8x A100 80GB

# Ephemeral: 12 hours default, adjust as needed
ActiveDeadlineSeconds: 43200

DelayExitTimeSeconds: 0

AccessType: "Private"

Storages:
    - Type: "Vepfs"
      MountPath: "/vePFS-Mindverse"
      SubPath: ""
      ReadOnly: true
    - Type: "Vepfs"
      MountPath: "/vePFS-Mindverse/share"
      SubPath: "share"
      ReadOnly: false
