# Ray Cluster - Single 8-GPU node (combined head + worker)
# Use this for simpler deployments where head and workers are on same node
# Submit with: volc ml_task submit -c ray_cluster_8gpu.yaml

TaskName: "ray-cluster-8gpu"
Description: "Ray cluster with 8 GPUs for dynamic workload allocation"

Entrypoint: |
  ray start --head --port=6379 --dashboard-host=0.0.0.0 --dashboard-port=8265 --num-gpus=8 && sleep infinity

ImageUrl: "image-mindverse-cn-beijing.cr.volces.com/namespace-mindverse/verl-vllm-megatron-lora:v0.1"

ResourceQueueID: "q-20251126180002-26lwz"

Framework: "Custom"

TaskRoleSpecs:
    - RoleName: "worker"
      RoleReplicas: 1
      Flavor: "ml.pni2l.28xlarge"  # 8x A100 80GB

# Max runtime: 5 days
ActiveDeadlineSeconds: 432000

# Keep instance for debugging after completion
DelayExitTimeSeconds: 1800

AccessType: "Private"

Storages:
    - Type: "Vepfs"
      MountPath: "/vePFS-Mindverse"
      SubPath: "share"
      ReadOnly: false
