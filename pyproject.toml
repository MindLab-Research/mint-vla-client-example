[project]
name = "tinker-server"
version = "0.1.0"
description = "Tinker-compatible inference server wrapping verl"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]==0.121.2",
    "uvicorn[standard]==0.38.0",
    "pydantic==2.12.4",
    "httpx==0.27.2",
    "asyncpg>=0.30.0",
    "ray[default]==2.51.1",
    "transformers==4.57.0",
    "accelerate==1.12.0",
    "omegaconf==2.3.0",
    "peft==0.18.0",
    "datasets==4.4.2",
    "tensordict==0.11.0",
    "torchdata==0.11.0",
    "onnxscript==0.5.2",
    "codetiming==1.4.0",
    "pyzmq>=27.1.0",
    "cachetools>=6.0.0",
    "sentencepiece>=0.2.0",
    "blake3>=1.0.0",
    "py-cpuinfo>=9.0.0",
    "openai>=1.99.1",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "tiktoken>=0.6.0",
    "lm-format-enforcer==0.11.3",
    "llguidance>=1.3.0,<1.4.0",
    "outlines_core==0.2.11",
    "diskcache==5.6.3",
    "lark==1.2.2",
    "partial-json-parser>=0.2.1.1.post7",
    "msgspec>=0.20.0",
    "gguf>=0.17.0",
    "mistral_common[image]>=1.9.0",
    "pillow>=12.0.0",
    "einops>=0.8.0",
    "python-json-logger>=4.0.0",
    "ninja>=1.13.0",
    "pybase64>=1.4.2",
    "cbor2>=5.7.1",
    "ijson>=3.4.0.post0",
    "setproctitle>=1.3.7",
    "openai-harmony>=0.0.3",
    "anthropic>=0.71.0",
    "model-hosting-container-standards>=0.1.13,<1.0.0",
    "mcp>=1.25.0",
    "grpcio-reflection>=1.76.0",
    "xgrammar==0.1.29",
    "compressed-tensors==0.13.0",
    "depyf==0.20.0",
    "requests>=2.32.0",
    "cryptography>=46.0.0",
    "safetensors>=0.6.0",
    "numpy>=2.3.0",
    "python-multipart>=0.0.20",
    "structlog==25.5.0",
    "opentelemetry-api==1.40.0",
    "opentelemetry-sdk==1.40.0",
    "opentelemetry-exporter-otlp==1.40.0",
    "opentelemetry-instrumentation==0.61b0",
    "opentelemetry-instrumentation-logging==0.61b0",
    "anyio>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["tinker_server*"]

[tool.pytest.ini_options]
markers = [
    "moe: tests requiring MoE resources",
    "slow: long-running tests",
]

[dependency-groups]
host-runtime = [
    "torch==2.9.1+cpu",
]
dev = [
    "trio>=0.33.0",
]

[tool.tinker.runtime_env]
python_version = "3.12.13"
site_packages_dir = "site-packages"
source_dir = "src"
host_venv_dir = "host-venv"
host_requirements = [
    "augmax>=0.3.4",
    "beartype==0.19.0",
    "filelock>=3.16.1",
    "flax==0.10.2",
    "fsspec[gcs]>=2024.6.0",
    "jax[cuda12]==0.5.3",
    "jaxtyping==0.2.36",
    "lerobot @ git+https://github.com/huggingface/lerobot.git@0cf864870cf29f4738d3ade893e6fd13fbd7cdb5",
    "ml_collections==1.0.0",
    "numpydantic>=1.6.6",
    "optax==0.2.4",
    "orbax-checkpoint==0.11.13",
    "pytest>=7.0.0",
    "tqdm-loggable>=0.2",
    "tyro>=0.9.5",
]

[[tool.tinker.runtime_env.sources]]
name = "Megatron-LM"
repo = "https://github.com/NVIDIA/Megatron-LM.git"
commit = "2d398b42fd4237fffb553109563d73ac099751c3"
pythonpath = ["."]

[[tool.tinker.runtime_env.sources]]
name = "Megatron-Bridge"
repo = "https://github.com/HollowMan6/Megatron-Bridge.git"
commit = "762fc5d3b717d24327c00ae37ce2be573e3f343b"
pythonpath = ["src", "."]

[[tool.tinker.runtime_env.sources]]
name = "verl"
repo = "https://github.com/verl-project/verl.git"
commit = "9433f8a8f2771256ea4f8f94e4401bcfe9703228"
pythonpath = ["."]

[[tool.tinker.runtime_env.sources]]
name = "openpi"
repo = "https://github.com/Physical-Intelligence/openpi.git"
commit = "e6b044115c075dc64a2e4e23d33ea3a3c293f123"
pythonpath = ["src", "packages/openpi-client/src"]

[[tool.tinker.runtime_env.sources]]
name = "vllm"
repo = "https://github.com/vllm-project/vllm.git"
commit = "89a77b10846fd96273cce78d86d2556ea582d26e"
pythonpath = ["."]
host_only = true
package_name = "vllm"
version = "0.16.0"

[tool.tinker.runtime_env.image_managed]
torch = "2.9.1+cu129 from mint:16 base image"
vllm = "0.16.x from mint:16 base image"
deep_ep = "base image managed"
deep_ep_cpp = "base image managed"
transformer_engine = "base image managed"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
